<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155c5d" />
    <meta name="description" content="Roamly reset password" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/Authentication.css" />
    <title>Roamly — Reset password</title>
  </head>
  <body>
    <main class="page-shell">
      <div class="ambient-orb orb-one"></div>
      <div class="ambient-orb orb-two"></div>
      <section class="experience" aria-label="Reset password">
        <a class="brand" href="login.html" aria-label="Back to sign in"
          ><span class="brand-mark">R</span><span>roamly</span></a
        >
        <div class="landscape" aria-hidden="true">
          <div class="sun"></div>
          <div class="cloud cloud-one"></div>
          <div class="cloud cloud-two"></div>
          <div class="birds bird-one"></div>
          <div class="birds bird-two"></div>
          <div class="ridge ridge-far"></div>
          <div class="ridge ridge-mid"></div>
          <div class="ridge ridge-near"></div>
          <div class="pine pine-one"></div>
          <div class="pine pine-two"></div>
          <div class="pine pine-three"></div>
          <div class="pine pine-four"></div>
        </div>
        <section class="login-panel" aria-labelledby="reset-title">
          <div class="panel-copy">
            <h1 id="reset-title">Set a new password 🔐</h1>
            <p>Choose a new password with at least 8 characters.</p>
          </div>
          <form id="reset-password-form" novalidate>
            <div class="field-group">
              <label for="reset-password">New password</label>
              <input
                id="reset-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
            <div class="field-group">
              <label for="reset-password-confirm">Confirm new password</label>
              <input
                id="reset-password-confirm"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
            <button class="login-button" type="submit">
              Reset password <span>→</span>
            </button>
            <div class="divider"><span>or Sign in Google</span></div>
            <button class="google-button" type="button" id="google-sign-in">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.4 3.1-7.4Z"
                ></path>
                <path
                  fill="#34A853"
                  d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H2.9v2.6A10 10 0 0 0 12 22Z"
                ></path>
                <path
                  fill="#FBBC05"
                  d="M6.2 13.7a6 6 0 0 1 0-3.5V7.6H2.9a10 10 0 0 0 0 8.9l3.3-2.8Z"
                ></path>
                <path
                  fill="#EA4335"
                  d="M12 5.9c1.5 0 2.9.5 3.9 1.5l2.9-2.9A10 10 0 0 0 2.9 7.6l3.3 2.6c.8-2.5 3.1-4.3 5.8-4.3Z"
                ></path></svg
              >Continue with Google
            </button>
            <p
              class="status-message"
              id="reset-status-message"
              aria-live="polite"
            ></p>
          </form>
          <p class="signup"><a href="login.html">Back to sign in</a></p>
        </section>
      </section>
    </main>
    <script src="../JS/Authentication.js"></script>
  </body>
</html>
